<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <title>Impaciência</title>
    <style>
        :root {
            --bg-table: #008000;
            --card-w: 85px;
            --card-h: 125px;
            --radius: 5px;
        }

        body { 
            background-color: #c0c0c0; 
            margin: 0; 
            font-family: 'Tahoma', sans-serif; 
            display: flex; 
            flex-direction: column; 
            height: 100vh; 
            overflow: hidden; 
        }

        .title-bar { 
            background: linear-gradient(90deg, #000080, #1084d0); 
            color: white; 
            padding: 4px 10px; 
            font-weight: bold; 
            display: flex; 
            justify-content: space-between; 
            border-bottom: 2px solid #fff; 
        }

        #game-board {
            background-color: var(--bg-table);
            flex-grow: 1;
            padding: 25px;
            position: relative;
            user-select: none;
        }

        .row { display: flex; gap: 20px; margin-bottom: 35px; }

        .slot {
            width: var(--card-w);
            height: var(--card-h);
            border: 2px solid rgba(0,0,0,0.3);
            border-radius: var(--radius);
            position: relative;
        }

        /* Estilo do Stock (Baralho) */
        #stock { cursor: pointer; }
        #stock.has-cards {
            background: #0000a8;
            background-image: repeating-linear-gradient(45deg, #000080 25%, transparent 25%, transparent 50%, #000080 50%, #000080 75%, transparent 75%, transparent);
            background-size: 10px 10px;
            border: 2px solid #fff;
        }
        #stock.empty {
            background: rgba(0,0,0,0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 40px;
        }

        /* Estilo da Carta */
        .card {
            width: var(--card-w);
            height: var(--card-h);
            background: white;
            border: 1px solid black;
            border-radius: var(--radius);
            position: absolute;
            box-sizing: border-box;
            padding: 5px;
            cursor: pointer;
            box-shadow: 2px 2px 4px rgba(0,0,0,0.4);
        }
        .card.back {
            background: #0000a8;
            background-image: repeating-linear-gradient(45deg, #000080 25%, transparent 25%, transparent 50%, #000080 50%, #000080 75%, transparent 75%, transparent);
            background-size: 10px 10px;
            border: 2px solid #fff;
        }

        .card[data-color="red"] { color: #d00; }
        .card .rank { font-size: 26px; font-weight: 900; display: block; }
        .card .suit-mini { font-size: 16px; margin-top: -5px; display: block; }
        .card .face-icon { font-size: 45px; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); opacity: 0.15; }
        .card .suit-main { font-size: 32px; position: absolute; bottom: 5px; right: 8px; }

        .tableau-pile { width: var(--card-w); min-height: var(--card-h); position: relative; }
        .dragging { opacity: 0.5; }
    </style>
</head>
<body>

    <div class="title-bar">
        <span>Impaciência.exe v3.1</span>
        <span>_ □ X</span>
    </div>

    <div id="game-board">
        <div class="row">
            <div id="stock" class="slot" onclick="game.drawCard()"></div>
            <div id="waste" class="slot"></div>
            
            <div style="flex-grow: 1"></div>
            
            <div class="slot foundation" data-suit="hearts"></div>
            <div class="slot foundation" data-suit="diamonds"></div>
            <div class="slot foundation" data-suit="clubs"></div>
            <div class="slot foundation" data-suit="spades"></div>
        </div>

        <div class="row" id="tableau-row">
            <div class="tableau-pile" data-idx="0"></div>
            <div class="tableau-pile" data-idx="1"></div>
            <div class="tableau-pile" data-idx="2"></div>
            <div class="tableau-pile" data-idx="3"></div>
            <div class="tableau-pile" data-idx="4"></div>
            <div class="tableau-pile" data-idx="5"></div>
            <div class="tableau-pile" data-idx="6"></div>
        </div>
    </div>

<script>
    const SYMBOLS = { hearts: '♥', diamonds: '♦', clubs: '♣', spades: '♠' };
    const FACE_ICONS = { 11: '⚔️', 12: '👑', 13: '♚' };

    class Card {
        constructor(suit, value) {
            this.suit = suit;
            this.value = value;
            this.isFaceUp = false;
            this.color = (suit === 'hearts' || suit === 'diamonds') ? 'red' : 'black';
        }
        getLabel() {
            if (this.value === 1) return 'A';
            if (this.value === 11) return 'J';
            if (this.value === 12) return 'Q';
            if (this.value === 13) return 'K';
            return this.value;
        }
    }

    class Solitaire {
        constructor() {
            this.init();
        }

        init() {
            this.stock = [];
            this.waste = [];
            this.foundations = { hearts: [], diamonds: [], clubs: [], spades: [] };
            this.tableau = Array.from({ length: 7 }, () => []);

            let deck = [];
            Object.keys(SYMBOLS).forEach(s => {
                for (let v = 1; v <= 13; v++) deck.push(new Card(s, v));
            });

            // Embaralhar
            for (let i = deck.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [deck[i], deck[j]] = [deck[j], deck[i]];
            }

            // Distribuir
            for (let i = 0; i < 7; i++) {
                for (let j = 0; j <= i; j++) {
                    let card = deck.pop();
                    if (j === i) card.isFaceUp = true;
                    this.tableau[i].push(card);
                }
            }
            this.stock = deck;
            this.render();
        }

        // LÓGICA DE COMPRA CORRIGIDA: 1 carta por vez
        drawCard() {
            console.log("Tentando comprar carta...");
            if (this.stock.length > 0) {
                // Tira 1 carta do estoque
                const card = this.stock.pop();
                card.isFaceUp = true;
                this.waste.push(card);
                console.log("Carta comprada:", card);
            } else if (this.waste.length > 0) {
                // Se o estoque estiver vazio, recicla o waste
                console.log("Reciclando baralho...");
                this.stock = [...this.waste].reverse().map(c => {
                    c.isFaceUp = false;
                    return c;
                });
                this.waste = [];
            }
            this.render();
        }

        moveCards(source, target) {
            let srcArr = this.getPileArray(source);
            let cardsToMove = srcArr.splice(source.cardIdx);

            if (this.isValidMove(cardsToMove[0], target)) {
                let destArr = this.getPileArray(target);
                destArr.push(...cardsToMove);
                if (srcArr.length > 0) srcArr[srcArr.length - 1].isFaceUp = true;
                this.render();
            } else {
                srcArr.push(...cardsToMove);
            }
        }

        isValidMove(card, target) {
            let destArr = this.getPileArray(target);
            let top = destArr.length > 0 ? destArr[destArr.length - 1] : null;

            if (target.type === 'tableau') {
                if (!top) return card.value === 13;
                return (card.color !== top.color) && (card.value === top.value - 1);
            }
            if (target.type === 'foundation') {
                if (!top) return card.value === 1 && card.suit === target.suit;
                return (card.suit === top.suit) && (card.value === top.value + 1);
            }
            return false;
        }

        getPileArray(loc) {
            if (loc.type === 'tableau') return this.tableau[loc.idx];
            if (loc.type === 'waste') return this.waste;
            if (loc.type === 'foundation') return this.foundations[loc.suit];
        }

        render() {
            // Render Stock (Visual do monte de compra)
            const stockEl = document.getElementById('stock');
            if (this.stock.length > 0) {
                stockEl.className = 'slot has-cards';
                stockEl.innerHTML = '';
            } else {
                stockEl.className = 'slot empty';
                stockEl.innerHTML = '↺'; // Símbolo de reciclar
            }

            // Render Waste (Apenas a carta do topo do descarte é visível e arrastável)
            const wasteEl = document.getElementById('waste');
            wasteEl.innerHTML = '';
            if (this.waste.length > 0) {
                const topWasteCard = this.waste[this.waste.length - 1];
                wasteEl.appendChild(this.createCardEl(topWasteCard, {type: 'waste', cardIdx: this.waste.length-1}));
            }

            // Render Foundations
            document.querySelectorAll('.foundation').forEach(f => {
                f.innerHTML = '';
                const suit = f.dataset.suit;
                this.foundations[suit].forEach((c, idx) => {
                    f.appendChild(this.createCardEl(c, {type: 'foundation', suit: suit, cardIdx: idx}));
                });
            });

            // Render Tableau
            document.querySelectorAll('.tableau-pile').forEach((p, i) => {
                p.innerHTML = '';
                this.tableau[i].forEach((c, j) => {
                    const el = this.createCardEl(c, {type: 'tableau', idx: i, cardIdx: j});
                    el.style.top = (j * 25) + 'px';
                    p.appendChild(el);
                });
            });
        }

        createCardEl(card, loc) {
            const div = document.createElement('div');
            div.className = 'card' + (card.isFaceUp ? '' : ' back');
            
            if (card.isFaceUp) {
                div.dataset.color = card.color;
                div.draggable = true;
                div.innerHTML = `
                    <span class="rank">${card.getLabel()}</span>
                    <span class="suit-mini">${SYMBOLS[card.suit]}</span>
                    ${FACE_ICONS[card.value] ? `<div class="face-icon">${FACE_ICONS[card.value]}</div>` : ''}
                    <span class="suit-main">${SYMBOLS[card.suit]}</span>
                `;
                
                div.ondragstart = (e) => {
                    e.dataTransfer.setData('json', JSON.stringify(loc));
                    setTimeout(() => div.classList.add('dragging'), 0);
                };
                div.ondragend = () => div.classList.remove('dragging');
            }
            return div;
        }
    }

    // Instancia o jogo globalmente para o onclick funcionar
    const game = new Solitaire();

    // Eventos de Drop
    document.querySelectorAll('.tableau-pile').forEach(p => {
        p.ondragover = e => e.preventDefault();
        p.ondrop = e => {
            const source = JSON.parse(e.dataTransfer.getData('json'));
            game.moveCards(source, {type: 'tableau', idx: parseInt(p.dataset.idx)});
        };
    });

    document.querySelectorAll('.foundation').forEach(f => {
        f.ondragover = e => e.preventDefault();
        f.ondrop = e => {
            const source = JSON.parse(e.dataTransfer.getData('json'));
            const srcArr = game.getPileArray(source);
            if (source.cardIdx !== srcArr.length - 1) return;
            game.moveCards(source, {type: 'foundation', suit: f.dataset.suit});
        };
    });
</script>
</body>
</html>
